[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "temporalfix"
version = "0.1.0"
description = "Detector-agnostic temporal repair for frame-level video detections"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "TemporalFix contributors" }]
maintainers = [{ name = "Sunday James" }]
keywords = [
  "computer-vision",
  "detections",
  "temporal-smoothing",
  "video",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
ultralytics = ["ultralytics>=8.3"]
supervision = ["supervision>=0.25"]
opencv = ["opencv-python-headless>=4.10"]
onnx = ["onnx>=1.17"]
all = [
  "onnx>=1.17",
  "opencv-python-headless>=4.10",
  "supervision>=0.25",
  "ultralytics>=8.3",
]

[project.scripts]
temporalfix = "temporalfix.cli:main"

[project.urls]
Documentation = "https://James-Sunday.github.io/temporalfix/"
Issues = "https://github.com/James-Sunday/temporalfix/issues"
Repository = "https://github.com/James-Sunday/temporalfix"

[dependency-groups]
dev = [
  "bandit>=1.8.6",
  "build>=1.3.0",
  "detect-secrets>=1.5.0",
  "hypothesis>=6.138.0",
  "mypy>=1.17.0",
  "pip-audit>=2.9.0",
  "pre-commit>=4.2.0",
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
  "twine>=6.1.0",
  "types-PyYAML>=6.0.12",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.6.0",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/temporalfix"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/benchmarks",
  "/docs",
  "/research",
  "/scripts",
  "/.github",
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/THIRD_PARTY_LICENSES.md",
  "/mkdocs.yml",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
  "-ra",
]
testpaths = ["tests"]
markers = [
  "integration: exercises optional third-party dependencies",
  "performance: records performance without asserting an unmeasured threshold",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["temporalfix"]

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "BLE",
  "C4",
  "C90",
  "D",
  "DTZ",
  "E",
  "F",
  "FA",
  "FBT",
  "FURB",
  "I",
  "ICN",
  "INP",
  "LOG",
  "N",
  "NPY",
  "PERF",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W",
]
ignore = [
  "D203",
  "D213",
  "ANN401",
  "PLR0913",
  "PLR0911",
  "PLR0917",
  "PLR2004",
  "S101",
  "TC002",
  "TC003",
  "TRY003",
  "TRY004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "INP", "PLR2004"]
"examples/**" = ["D", "INP", "T201"]
"scripts/**" = ["INP", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 20
max-statements = 80

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
