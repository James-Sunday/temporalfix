site_name: TemporalFix
site_description: Detector-agnostic temporal repair for video detections
site_url: https://James-Sunday.github.io/temporalfix/
repo_url: https://github.com/James-Sunday/temporalfix
repo_name: James-Sunday/temporalfix
copyright: "Copyright TemporalFix contributors; Apache-2.0"

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - User guide:
      - Quick start: quickstart.md
      - Configuration: configuration.md
      - CLI: cli.md
      - Optional integrations: integrations.md
  - Reference:
      - Public API: api.md
      - Architecture: architecture.md
      - Synthetic scenarios: synthetic-scenarios.md
  - Evaluation:
      - Benchmark methodology: benchmarks.md
      - Accuracy and performance: accuracy-and-performance.md
      - Research protocol: research.md
  - Project:
      - Known limitations: known-limitations.md
      - Troubleshooting and FAQ: troubleshooting.md
      - Contributing: contributing.md
      - Security: security.md
      - Release process: release.md
      - Citation: citation.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables

strict: true
